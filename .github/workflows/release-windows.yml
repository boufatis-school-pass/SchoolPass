name: Build and publish SchoolPass Windows installer

on:
  push:
    branches:
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Verify Python version
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 14), f'Expected Python 3.14, got {sys.version}'"
          if ($LASTEXITCODE -ne 0) { throw "Python 3.14 verification failed" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Install Python build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }

          python -m pip install -r requirements_dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }

      - name: Build and test installer
        shell: powershell
        run: .\build_windows.ps1

      - name: Publish release installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SchoolPass ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SchoolPass_Setup.exe
            dist/SchoolPass_Setup.exe.sha256
          fail_on_unmatched_files: true
